server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 8.160.183.37;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/epilepsy-acme;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "Deployment in progress.\n";
    }
}
