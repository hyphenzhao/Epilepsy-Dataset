server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 8.160.183.37;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/epilepsy-acme;
        try_files $uri =404;
    }
    location / {
        return 301 https://8.160.183.37$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name 8.160.183.37;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/8.160.183.37/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8.160.183.37/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:EpilepsyTLS:10m;
    ssl_session_timeout 10m;

    client_max_body_size 1g;
    client_body_timeout 300s;

    location /static/ {
        alias /srv/epilepsy-portal/epilepsy_portal/static/;
        access_log off;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        add_header Cache-Control "no-store" always;
    }
}
